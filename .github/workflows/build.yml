name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # 태그 푸시 시 Release 생성용

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 태그(v1.2.3)면 태그에서 버전을 뽑고, 일반 푸시면 개발 버전을 붙인다
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = "1.0.0-dev.${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # ① 프레임워크 의존 단일 exe (~2MB, 실행 PC에 .NET 8 Desktop Runtime + VISA 런타임 필요)
      - name: Publish (framework-dependent)
        run: >
          dotnet publish RigolWidget.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-fdd

      # ② self-contained 단일 exe (~70MB, .NET 런타임 포함, VISA 런타임만 있으면 실행)
      - name: Publish (self-contained standalone)
        run: >
          dotnet publish RigolWidget.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-sc

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish-fdd/RigolWidget.exe dist/RigolWidget.exe
          Copy-Item publish-sc/RigolWidget.exe dist/RigolWidget-standalone.exe
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RigolWidget-win-x64
          path: dist/*

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}'
          'dist/RigolWidget.exe#RigolWidget.exe (2MB, .NET 8 Desktop Runtime 필요)'
          'dist/RigolWidget-standalone.exe#RigolWidget-standalone.exe (런타임 포함)'
          --title 'RigolWidget ${{ github.ref_name }}'
          --generate-notes
